<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们只在世界毁灭时相见</title><style>html,body{margin:0;width:100%;height:100%;background:#eeece5;overflow:hidden}#language{position:fixed;left:12px;top:12px;z-index:5;border:1px solid #b5b3aa;border-radius:5px;background:#f5f3ebec;color:#34424a;padding:7px 9px;font:14px system-ui,sans-serif}iframe{position:absolute;inset:0;width:min(100vw,56.25vh);height:100%;border:0;left:50%;transform:translateX(-50%)}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#eeece5;color:#66747b;font:15px sans-serif;z-index:3}#loading[hidden]{display:none}</style><script src="audio/bgm_controller.js"></script><select id="language" aria-label="游戏语言"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option></select><iframe id="game" title="游戏" allow="autoplay; fullscreen" src="prologue/game.html"></iframe><div id="loading" hidden>正在接续故事…</div><script>
const langs=['zh-Hans','zh-Hant','en'];const queryLang=new URLSearchParams(location.search).get('lang');if(langs.includes(queryLang))localStorage.setItem('storyLanguage',queryLang);let storyLang=langs.includes(localStorage.getItem('storyLanguage'))?localStorage.getItem('storyLanguage'):'zh-Hans';const langPicker=document.getElementById('language');langPicker.value=storyLang;document.documentElement.lang=storyLang;langPicker.onchange=()=>{localStorage.setItem('storyLanguage',langPicker.value);location.reload();};document.getElementById('game').src='prologue/game.html?lang='+encodeURIComponent(storyLang);document.getElementById('loading').textContent=storyLang==='en'?'Continuing the story…':storyLang==='zh-Hant'?'正在接續故事…':'正在接续故事…';document.title=storyLang==='en'?'We Meet Only When the World Ends':storyLang==='zh-Hant'?'我們只在世界毀滅時相見':'我们只在世界毁灭时相见';if(new URLSearchParams(location.search).get('chapter')==='g04')document.getElementById('game').src='prologue/game.html?chapter=g04&lang='+encodeURIComponent(storyLang);
let transitioning=false;
window.beginFinale=()=>{if(transitioning)return;transitioning=true;window.dispatchEvent(new Event('finale-starting'));document.getElementById('loading').hidden=false;document.getElementById('game').src='finale/interaction_review.html?from=g04&lang='+encodeURIComponent(storyLang);};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data==='story-ready')document.getElementById('loading').hidden=true;});

if(['127.0.0.1','localhost'].includes(location.hostname))setInterval(()=>fetch('/__heartbeat',{cache:'no-store'}).catch(()=>{}),5000);
</script><script src="preload.js?v=1"></script></html>
