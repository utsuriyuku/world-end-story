<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>我们只在世界毁灭时相见 · 连续试玩</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #eeece5;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #eeece5;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="game.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="game.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game","experimentalVK":false,"fileSizes":{"game.pck":73428960,"game.wasm":38057390},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const chapter=new URLSearchParams(location.search).get('chapter');
if(chapter==='g04')GODOT_CONFIG.args=['res://qa_g04.tscn','--','--start-g04'];
if(chapter==='market') GODOT_CONFIG.args=['res://qa_market.tscn'];
if(chapter==='d01') GODOT_CONFIG.args=['--','--start-d01'];
if(chapter==='b03')GODOT_CONFIG.args=['--','--start-b03'];
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');

        const timingEnabled=new URLSearchParams(location.search).has('timing') || new URLSearchParams(parent.location.search).has('timing');
        const records={}; window.loadTimings=records;
        const panel=document.createElement('div');
        if(timingEnabled){panel.style.cssText='position:fixed;top:8px;left:8px;right:8px;z-index:999;background:#10202de8;color:#eef4f5;padding:12px;font:12px/1.7 sans-serif;pointer-events:none';document.body.appendChild(panel);}
        const begin=performance.now();
        function renderTiming(){if(!timingEnabled)return;const rows=['加载计时（本次访问）'];for(const key of Object.keys(records))rows.push(key+'：'+records[key]);rows.push('总计：'+((performance.now()-begin)/1000).toFixed(2)+' 秒');panel.textContent=rows.join('\n');panel.style.whiteSpace='pre-line';}
        const observer=new PerformanceObserver(list=>{for(const e of list.getEntries()){if(/game\.(pck|wasm)(?:\?|$)/.test(e.name)){const label=e.name.includes('.pck')?'资源包下载':'引擎文件下载';records[label]=(e.duration/1000).toFixed(2)+' 秒'+(e.transferSize===0?'（缓存或未报告传输量）':'');renderTiming();}}});observer.observe({type:'resource',buffered:true});
        const oldInit=engine.init.bind(engine);let initRecorded=false;
        engine.init=function(...args){if(initRecorded)return oldInit(...args);initRecorded=true;const t=performance.now();return oldInit(...args).then(v=>{records['引擎准备（含下载/编译，可与资源下载重叠）']=((performance.now()-t)/1000).toFixed(2)+' 秒';renderTiming();return v;});};
        const oldStart=engine.start.bind(engine);
        engine.start=function(...args){const t=performance.now();return oldStart(...args).then(v=>{records['资源装入与游戏启动']=((performance.now()-t)/1000).toFixed(2)+' 秒';renderTiming();return v;});};
        renderTiming();
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
            window.parent.postMessage('prologue-started',location.origin);
            records['启动流程完成']=((performance.now()-begin)/1000).toFixed(2)+' 秒';renderTiming();
		}, displayFailureNotice);
	}
}());
		</script>
	<script src="../audio/game_audio.js"></script></body>
</html>
